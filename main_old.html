<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celestial 3D Viewer - Abandoned but Not Forgotten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Great+Vibes&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--bg:#000000;--fg:#eef1f7;--mut:#9aa4b8;--acc:#e8b04a;--pan:rgba(10,14,26,.84);--ln:rgba(255,255,255,.14);box-sizing:border-box}
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); font: 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  
  /* Clean Minimal Toggle Switch (Bottom Left) */
  .toggle-container {
    position: absolute;
    bottom: 24px;
    left: 24px;
    display: flex;
    background: rgba(10, 14, 26, 0.75);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 3px;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }

  .toggle-btn {
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    padding: 7px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    outline: none;
  }

  .toggle-btn.active {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  .toggle-btn:hover:not(.active) {
    color: rgba(255, 255, 255, 0.9);
  }

  /* UI Panel / Card positioned on the right side */
  #panel{position:absolute;right:24px;bottom:24px;width:100%;max-width:380px;z-index:10;pointer-events:none}
  #chips{display:none;}
  #card{background:var(--pan);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #yr{color:var(--mut);font-size:12px}
  h2{font:600 19px/1.2 Georgia,"Times New Roman",serif;margin:2px 0 6px}
  #tx{margin:0 0 12px;font-size:14px;max-width:100%}
  #tx span.on{color:var(--acc)}
  .btns{justify-content:flex-start;gap:8px}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  button.on{background:var(--acc);border-color:var(--acc);color:#1a1205}
  button:disabled{opacity:.4;cursor:default}
  #note{margin:10px 0 0;font-size:11px;color:var(--mut)}
  #x{padding:6px 14px;font-size:13px}

  @media (max-width: 768px) {
    #panel { left: 12px; right: 12px; bottom: 12px; max-width: none; }
  }

  /* Calligraphy title (left side) */
  #hero{position:absolute;left:4vw;top:50%;transform:translateY(-50%);z-index:5;pointer-events:none;user-select:none;color:#fff}
  #hero h1{margin:0;font:400 clamp(54px,9.2vw,168px)/.92 "Pinyon Script","Great Vibes","Snell Roundhand","Apple Chancery","Brush Script MT",cursive;letter-spacing:.005em;filter:url(#ink);text-shadow:0 0 28px rgba(255,255,255,.18)}
  #hero .ln{display:block;white-space:nowrap;clip-path:inset(-30% 100% -30% -6%);animation:write 1.5s cubic-bezier(.45,.05,.3,1) forwards}
  #hero .l1{animation-delay:.3s}
  #hero .l2{margin-left:.9em;font-size:.72em;animation-delay:1.5s;animation-duration:1.1s}
  #hero .l3{margin-left:.25em;animation-delay:2.4s;animation-duration:1.7s}
  @keyframes write{to{clip-path:inset(-30% -12% -30% -6%)}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){
    #hero .ln{animation:none;clip-path:none}
  }
  @media (max-width: 900px){
    #hero{top:5vh;transform:none;left:6vw;opacity:.92}
    #hero h1{font-size:clamp(44px,15vw,96px)}
  }

  /* ---- Polish layer ---- */
  :root{--acc:#b9c8ff}
  html[data-body="mars"]{--acc:#ff8a4c}
  #hero h1{text-shadow:0 0 40px color-mix(in srgb,var(--acc) 38%,transparent)}
  #hero{transition:opacity .8s ease,transform .8s ease}
  html[data-sel="on"] #hero{opacity:.12;transform:translate(-2vw,-50%)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 70% 50%,transparent 45%,rgba(0,0,0,.65) 100%)}

  .toggle-container{padding:4px;gap:0;transition:box-shadow .6s}
  .toggle-container::before{content:"";position:absolute;top:4px;left:4px;width:84px;height:calc(100% - 8px);border-radius:999px;background:color-mix(in srgb,var(--acc) 26%,rgba(255,255,255,.08));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 40%,transparent);transition:transform .5s cubic-bezier(.3,1.35,.5,1),background .5s}
  html[data-body="mars"] .toggle-container::before{transform:translateX(84px)}
  .toggle-container .toggle-btn,.toggle-container .toggle-btn.active{position:relative;width:84px;padding:8px 0;background:transparent;box-shadow:none;border:0}
  .toggle-container .toggle-btn.active{color:#fff}

  #card{position:relative;overflow:hidden;border:1px solid transparent;border-radius:18px;padding:18px 20px 16px;
    background:linear-gradient(var(--pan),var(--pan)) padding-box,linear-gradient(140deg,color-mix(in srgb,var(--acc) 70%,transparent),rgba(255,255,255,.07) 38%,rgba(255,255,255,.03)) border-box;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both .4s}
  #card.swap>.row:first-of-type,#card.swap #tx{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #yr{letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;color:var(--acc)}
  h2{font-size:26px;margin:4px 0 8px}
  #tx{line-height:1.6;color:#d8deec}
  #bar{position:absolute;left:0;top:0;height:2px;width:100%;background:rgba(255,255,255,.06)}
  #bar i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 10px var(--acc);transition:width .8s ease}
  #dots{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  #dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--acc) 70%,transparent);background:transparent;transition:transform .25s,background .25s,box-shadow .25s}
  #dots button:hover{transform:scale(1.5)}
  #dots button.cur{background:var(--acc);box-shadow:0 0 10px var(--acc);transform:scale(1.25)}
  #cnt{margin-left:auto;font-size:11px;color:var(--mut);letter-spacing:.1em;font-variant-numeric:tabular-nums}
  button{transition:background .25s,border-color .25s,transform .2s,color .25s}
  .btns button:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px)}
  #next{border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:color-mix(in srgb,var(--acc) 18%,transparent)}
  #next span{margin-left:4px;color:var(--acc)}
  #sim{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
  button.on{color:#0b0d14}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none;white-space:nowrap;transition:opacity 1s;animation:rise 1s ease both 5s}
  #hint.gone{opacity:0!important}
  #tooltip{border-radius:999px;padding:6px 14px;border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
  @media (max-width:900px){#hint{display:none}.toggle-container{bottom:auto;top:auto}}
  @media (prefers-reduced-motion: reduce){#card,#hint{animation:none}}

  /* ---- Typography ---- */
  html,body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:Inter,system-ui,sans-serif;font-weight:500;letter-spacing:.02em}
  #hero h1{font-family:"Great Vibes","Pinyon Script","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(50px,8.6vw,160px);line-height:1.02;font-feature-settings:"liga","calt";font-kerning:normal}
  #hero .l2{font-size:.66em}
  #hero .cap{font-size:1.38em;line-height:.8;display:inline-block;vertical-align:baseline;margin-right:.02em}
  h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:32px;line-height:1.1;letter-spacing:.005em}
  #yr{font-weight:600;letter-spacing:.2em}
  #tx{font-size:14.5px;line-height:1.7;letter-spacing:.005em}
  #note,#cnt{letter-spacing:.06em}
  .toggle-container .toggle-btn{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  #hint,#tooltip{font-family:Inter,system-ui,sans-serif}
  #tooltip{font-weight:500;letter-spacing:.03em}

  /* ---- Selected site: info window replaces the title ---- */
  html[data-sel="on"] #hero{opacity:0;visibility:hidden;transform:translate(-3vw,-50%);transition:opacity .5s ease,transform .8s ease,visibility 0s .5s}
  html[data-sel="on"] #panel{right:auto;left:4vw;top:50%;bottom:auto;transform:translateY(-50%);max-width:min(540px,46vw)}
  html[data-sel="on"] #card{padding:32px 34px 28px;border-radius:22px}
  html[data-sel="on"] #yr{font-size:12px}
  html[data-sel="on"] h2{font-size:clamp(40px,4.4vw,64px);margin:8px 0 14px}
  html[data-sel="on"] #tx{font-size:clamp(15.5px,1.2vw,18px);line-height:1.75;margin-bottom:22px}
  html[data-sel="on"] #dots{margin-bottom:18px}
  html[data-sel="on"] .btns button{padding:9px 18px;font-size:14px}
  html[data-sel="on"] #note{display:none}
  @media (max-width:900px){
    html[data-sel="on"] #panel{left:12px;right:12px;top:auto;bottom:12px;transform:none;max-width:none}
    html[data-sel="on"] #card{padding:20px 20px 18px}
    html[data-sel="on"] h2{font-size:34px}
  }

  /* Hover Tooltip Popup */
  #tooltip {
    position: absolute;
    background: rgba(10, 14, 26, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    pointer-events: none;
    transform: translate(-50%, -130%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease;
    z-index: 20;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  /* ---- Space-tech title + landing toggle (under the title) ---- */
  #hero h1{font-family:"Great Vibes","Pinyon Script","Snell Roundhand","Apple Chancery",cursive;font-weight:400;font-size:clamp(50px,8.6vw,160px);line-height:1.02;letter-spacing:.005em;filter:url(#ink);text-shadow:none}
  /* Glow fades in per line only after that line has finished writing */
  #hero .ln{text-shadow:0 0 0 transparent}
  #hero .l1{animation:write 1.5s cubic-bezier(.45,.05,.3,1) .3s forwards,glow 1.2s ease 1.8s forwards}
  #hero .l2{animation:write 1.1s cubic-bezier(.45,.05,.3,1) 1.5s forwards,glow 1.2s ease 2.6s forwards}
  #hero .l3{animation:write 1.7s cubic-bezier(.45,.05,.3,1) 2.4s forwards,glow 1.2s ease 4.1s forwards}
  @keyframes glow{to{text-shadow:0 0 40px color-mix(in srgb,var(--acc) 38%,transparent)}}
  @media (prefers-reduced-motion: reduce){#hero .ln{animation:none!important;clip-path:none;text-shadow:0 0 40px color-mix(in srgb,var(--acc) 38%,transparent)}}
  #hero .l2{margin-left:.9em;font-size:.66em}
  #hero .l3{margin-left:.25em}
  #hero .toggle-container{--tw:132px;position:relative;bottom:auto;left:auto;display:flex;width:fit-content;margin:clamp(22px,4vh,44px) auto 0;padding:6px;pointer-events:auto;animation:rise 1s cubic-bezier(.2,.8,.2,1) both 3.6s}
  #hero .toggle-container::before{top:6px;left:6px;width:var(--tw);height:calc(100% - 12px)}
  html[data-body="mars"] #hero .toggle-container::before{transform:translateX(var(--tw))}
  #hero .toggle-container .toggle-btn,#hero .toggle-container .toggle-btn.active{width:var(--tw);padding:14px 0;font-size:14px;letter-spacing:.2em}
  @media (max-width:900px){
    #hero h1{font-size:clamp(44px,15vw,96px)}
    #hero .toggle-container{--tw:112px}
    #hero .toggle-container .toggle-btn,#hero .toggle-container .toggle-btn.active{padding:12px 0;font-size:12.5px}
  }
  @media (prefers-reduced-motion: reduce){#hero .toggle-container,#hero .pick{animation:none}}

  /* Landing: "Pick a site" is plain text under the toggle, not a window */
  html:not([data-sel="on"]) #panel{display:none}
  #hero .pick{max-width:320px;margin:18px auto 0;text-align:center;font-family:Inter,system-ui,sans-serif;animation:rise 1s cubic-bezier(.2,.8,.2,1) both 3.9s}
  #hero .pick b{display:block;font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--acc)}
  #hero .pick span{display:block;margin-top:6px;font-size:12.5px;line-height:1.6;letter-spacing:.02em;color:rgba(255,255,255,.55)}

  /* Clickable site names row under "Pick a site" */
  #hero .site-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 10px;
    margin-top: 12px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    pointer-events: auto;
  }
  #hero .site-links button {
    background: transparent;
    border: none;
    color: var(--acc);
    padding: 2px 4px;
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s, opacity 0.2s;
  }
  #hero .site-links button:hover {
    color: #ffffff;
  }
  #hero .site-links .sep {
    color: rgba(255, 255, 255, 0.3);
    user-select: none;
    display: inline-flex;
    align-items: center;
  }

  /* ---- Coordinate tracker (press Y) ---- */
  #coord{position:fixed;left:0;top:0;z-index:25;pointer-events:none;opacity:0;transition:opacity .15s ease;padding:8px 12px;border-radius:10px;background:rgba(10,14,26,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 4px 15px rgba(0,0,0,.5);font:500 12.5px/1.55 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:#fff;white-space:nowrap;will-change:transform}
  #coord div{display:flex;gap:10px}
  #coord b{display:inline-block;min-width:28px;font-weight:600;font-size:10px;letter-spacing:.16em;color:var(--acc);align-self:center}
  #coord-dot{position:fixed;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;z-index:24;pointer-events:none;opacity:0;border-radius:50%;border:1.5px solid var(--acc);box-shadow:0 0 8px var(--acc),inset 0 0 4px rgba(0,0,0,.6);transition:opacity .15s ease;will-change:transform}
  #coord-toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-8px);z-index:30;pointer-events:none;opacity:0;padding:7px 16px;border-radius:999px;background:rgba(10,14,26,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#fff;transition:opacity .25s ease,transform .25s ease}
  #coord-toast.show{opacity:1;transform:translate(-50%,0)}
  /* ---- Mission card (landing): one mission per world ---- */
  #hero .pick{max-width:none;width:min(360px,86vw);margin:22px auto 0}
  #hero .pick b,#hero .pick span.legacy{display:none}
  .mission{position:relative;display:block;width:100%;text-align:left;white-space:normal;cursor:pointer;pointer-events:auto;overflow:hidden;
    padding:18px 20px 16px;border:1px solid transparent;border-radius:18px;color:var(--fg);font-family:Inter,system-ui,sans-serif;
    background:linear-gradient(rgba(10,14,26,.78),rgba(10,14,26,.78)) padding-box,linear-gradient(140deg,color-mix(in srgb,var(--acc) 75%,transparent),rgba(255,255,255,.06) 40%,rgba(255,255,255,.03)) border-box;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 36px color-mix(in srgb,var(--acc) 14%,transparent);
    transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .3s}
  .mission::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 60%)}
  .mission:hover{transform:translateY(-3px);box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 52px color-mix(in srgb,var(--acc) 28%,transparent)}
  .mission:active{transform:translateY(-1px)}
  .mission>span{position:relative;display:block}
  .m-eyebrow{display:flex!important;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
  .m-eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:ping 2s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
  .m-name{margin-top:10px;font:italic 600 clamp(38px,3.8vw,52px)/1.02 "Cormorant Garamond",Georgia,serif;color:#fff}
  .m-tag{margin-top:6px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.62)}
  .m-stats{display:flex!important;gap:8px;flex-wrap:wrap;margin-top:14px}
  .m-stats em{font-style:normal;padding:5px 10px;border-radius:999px;font-size:11px;letter-spacing:.04em;color:rgba(255,255,255,.8);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .m-stats em b{color:var(--acc);font-weight:600;margin-right:5px;letter-spacing:.12em;font-size:9.5px;text-transform:uppercase}
  .m-cta{display:flex!important;align-items:center;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#fff}
  .m-cta i{font-style:normal;font-size:16px;color:var(--acc);transition:transform .3s}
  .mission:hover .m-cta i{transform:translateX(5px)}
  .mission.swap>span{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  @media (prefers-reduced-motion: reduce){.m-eyebrow::before{animation:none}.mission.swap>span{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="ink" x="-5%" y="-10%" width="110%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header id="hero" aria-label="Abandoned but Not Forgotten">
  <h1>
    <span class="ln l1"><span class="cap">A</span>bandoned</span>
    <span class="ln l2">but Not</span>
    <span class="ln l3">Forgotten</span>
  </h1>
  <div class="toggle-container">
    <button id="btn-moon" class="toggle-btn active" onclick="switchBody('moon')">Moon</button>
    <button id="btn-mars" class="toggle-btn" onclick="switchBody('mars')">Mars</button>
  </div>
  <div class="pick">
    <button id="mission" class="mission" type="button" aria-label="Explore mission">
      <span class="m-eyebrow"></span>
      <span class="m-name"></span>
      <span class="m-tag"></span>
      <span class="m-stats"></span>
      <span class="m-cta">Simulate <i aria-hidden="true">&#9656;</i></span>
    </button>
    <div id="site-links" class="site-links" aria-hidden="true" hidden></div>
  </div>
</header>

<div id="panel">
<section id="card">
<div id="bar"><i></i></div>
<div id="dots" role="group" aria-label="Sites"></div>
<div class="row"><div><div id="yr">NASA hardware left behind</div><h2 id="nm">Pick a site</h2></div><button id="x" hidden aria-label="Back to landing page">← Back</button></div>
<p id="tx"></p>
<div class="row btns"><button id="sim" disabled>Simulate</button><button id="next" disabled>Next <span aria-hidden="true">&#9656;</span></button></div>
<p id="note">NASA 3D interactive model viewer with surface telemetry pinpoints.</p>
</section></div>

<div id="hint">Drag to rotate · Scroll to zoom · Y coordinates · Esc to return</div>
<div id="tooltip"></div>
<div id="coord" aria-hidden="true"></div>
<div id="coord-dot" aria-hidden="true"></div>
<div id="coord-toast" role="status" aria-live="polite"></div>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/libs/meshopt_decoder.js"></script>

<script>
const OBJ=[
{name:'Apollo 15 rover',body:'moon',yr:'1971',lat:26.132,lon:3.633,m:'lrv',t:'Apollo 15 brought the first Lunar Roving Vehicle to the Moon. Rovers were left behind on Apollo 15, 16 and 17. This one is parked near Hadley Rille, where its TV camera filmed the crew’s liftoff.'},
{name:'Opportunity',body:'mars',yr:'2004 to 2018',lat:-1.95,lon:-5.53,m:'mars',t:'Opportunity landed in 2004 for a 90-day mission and kept driving for more than fourteen years. In June 2018, a planet-wide dust storm blocked the sunlight it depended on, and it never woke up. It rests in Perseverance Valley.'},
];

const $=id=>document.getElementById(id),tx=$('tx'),nm=$('nm'),yr=$('yr'),simBtn=$('sim'),nextBtn=$('next'),xb=$('x'),tooltip=$('tooltip'),siteLinksCont=$('site-links');
const INTRO='Since the 1960s, NASA has left hardware on the Moon and Mars. Hover over pinpoints to explore the sites.';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);

function getFitZoom() {
  const aspect = camera.aspect || 1;
  const vFOV = THREE.MathUtils.degToRad(camera.fov);
  const distV = 1 / Math.sin(vFOV / 2);
  const hFOV = 2 * Math.atan(Math.tan(vFOV / 2) * aspect);
  const distH = 1 / Math.sin(hFOV / 2);
  return Math.max(distV, distH) * 1.15;
}

const MIN_ZOOM = 1.65;
let MAX_ZOOM = getFitZoom();
let targetZoom = MAX_ZOOM;
camera.position.set(0, 0, targetZoom);

scene.add(new THREE.AmbientLight(0xffffff, 0.08));
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(-4.5, 2.2, 4.0);
scene.add(sun);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  if (w > 900) camera.setViewOffset(w, h, -w * 0.16, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  MAX_ZOOM = getFitZoom();
  targetZoom = Math.min(targetZoom, MAX_ZOOM);
}
addEventListener('resize', resize);
resize();

const moonGroup = new THREE.Group();
const marsGroup = new THREE.Group();
scene.add(moonGroup);
scene.add(marsGroup);

marsGroup.scale.setScalar(0.001);
marsGroup.visible = false;

// ---- Texture <-> pinpoint alignment -------------------------------------
// lon/lat are degree offsets between the globe texture and the pin grid.
// flip=true mirrors east/west if the texture runs the other way.
// Press "C" in the viewer to calibrate live (arrows nudge, F flips), values print on screen + console.
const ALIGN = {
  moon: { lon: 177.9, lat: 0, flip: false }, // calibrated: Apollo 15 (26.132N, 3.633E) read 178.48W at lon 0
  mars: { lon: -90.55, lat: 1.73, flip: false } // calibrated: Opportunity (1.95S, 5.53W) read 0.217S, 96.082W at lon 0 / lat 0
};
const dirV=(la,lo,body='moon')=>{
  const A=ALIGN[body]||{lon:0,lat:0,flip:false};
  const a=(la+A.lat)*Math.PI/180,b=((A.flip?-lo:lo)+A.lon)*Math.PI/180;
  return new THREE.Vector3(Math.cos(a)*Math.sin(b),Math.sin(a),Math.cos(a)*Math.cos(b));
};
const siteDir=o=>dirV(o.lat,o.lon,o.body);

moonGroup.rotation.y = 0.4;
moonGroup.rotation.x = 0.15;

const ringGeo = new THREE.RingGeometry(0.015, 0.024, 32);
const pins = OBJ.map((o, i) => {
  const group = new THREE.Group();
  const dir = siteDir(o);
  group.position.copy(dir).multiplyScalar(1.008);
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);

  // Black for Moon, Dark Yellow for Mars
  const ringColor = o.body === 'moon' ? 0x000000 : 0xd4a017;

  const rings = [];
  const numRings = 2;
  for (let r = 0; r < numRings; r++) {
    const mat = new THREE.MeshBasicMaterial({
      color: ringColor,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthTest: false,
      depthWrite: false
    });
    const ring = new THREE.Mesh(ringGeo, mat);
    ring.position.z = 0.001;
    group.add(ring);
    rings.push(ring);
  }

  const h = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 8, 6),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  h.userData.i = i;
  group.add(h);
  group.userData.h = h;
  group.userData.rings = rings;
  group.userData.phase = i * 0.47;
  group.userData.dir = dir;

  if (o.body === 'moon') moonGroup.add(group);
  else marsGroup.add(group);
  return group;
});

const mat=(c,m,r)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const GOLD=mat(0xd9a63b,.6,.4),GRAY=mat(0x9aa0a8,.4,.6),WHITE=mat(0xe8e8e8,.2,.6),DARK=mat(0x2a2d33,.2,.8),PANEL=mat(0x1d3a6b,.4,.4);
const mk=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);return o;};
function legs(g,n,cx,cy,len,rz,m){for(let i=0;i<n;i++){const p=new THREE.Group();p.rotation.y=i*Math.PI*2/n;const l=mk(new THREE.CylinderGeometry(.015,.015,len,6),m,cx,cy,0);l.rotation.z=rz;p.add(l);p.add(mk(new THREE.CylinderGeometry(.06,.06,.015,12),m,cx+Math.sin(rz)*len/2,cy-Math.cos(rz)*len/2,0));g.add(p);}}
const M={
lander(){const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.36,.36,.24,8),GOLD,0,.3,0),mk(new THREE.BoxGeometry(.3,.3,.3),GRAY,0,.57,0));legs(g,4,.42,.14,.5,.55,GRAY);return g;},
tripod(){const g=new THREE.Group();g.add(mk(new THREE.CylinderGeometry(.03,.03,.5,8),GRAY,0,.45,0),mk(new THREE.BoxGeometry(.3,.05,.3),WHITE,0,.3,0),mk(new THREE.BoxGeometry(.4,.02,.25),PANEL,0,.74,0),mk(new THREE.BoxGeometry(.1,.08,.08),DARK,.1,.58,0));legs(g,3,.3,.13,.45,.6,WHITE);return g;},
rover(k){const g=new THREE.Group();g.add(mk(new THREE.BoxGeometry(.7,.1,.4),k=='lrv'?GRAY:WHITE,0,.2,0));
for(const x of [-.28,.28])for(const z of [-.27,.27]){const w=mk(new THREE.CylinderGeometry(.12,.12,.07,16),DARK,x,.12,z);w.rotation.x=Math.PI/2;g.add(w);}
if(k=='lrv'){g.add(mk(new THREE.BoxGeometry(.1,.14,.12),GOLD,-.08,.3,-.08),mk(new THREE.BoxGeometry(.1,.14,.12),GOLD,-.08,.3,.08),mk(new THREE.CylinderGeometry(.012,.012,.25,6),GRAY,.28,.33,0));const d=mk(new THREE.CylinderGeometry(.15,.02,.05,16),WHITE,.28,.47,0);d.rotation.z=.6;g.add(d);}
else g.add(mk(new THREE.BoxGeometry(.5,.02,.34),PANEL,0,.27,0),mk(new THREE.CylinderGeometry(.012,.012,.3,6),GRAY,0.22,.42,0),mk(new THREE.BoxGeometry(.08,.05,.06),DARK,.22,.58,0));
return g;},
heli(){const g=new THREE.Group();g.add(mk(new THREE.BoxGeometry(.16,.16,.16),WHITE,0,.4,0),mk(new THREE.CylinderGeometry(.012,.012,.3,6),GRAY,0,.62,0),mk(new THREE.BoxGeometry(.3,.015,.2),PANEL,0,.8,0));
const a=mk(new THREE.BoxGeometry(.9,.01,.05),DARK,0,.7,0),b=mk(new THREE.BoxGeometry(.9,.01,.05),DARK,0,.76,0);g.add(a,b);g.userData.spin=[a,b];legs(g,4,.1,.25,.34,.5,GRAY);return g;}
};
const build=k=>k=='mars'?M.rover(k):M[k]();

// ---- Snap pins onto the real mesh surface --------------------------------
const bodyRoot = { moon: null, mars: null };
const _ray = new THREE.Raycaster();
function snapPin(i){
  const o = OBJ[i], p = pins[i];
  const grp = o.body === 'moon' ? moonGroup : marsGroup;
  const root = bodyRoot[o.body];
  const dir = siteDir(o);
  p.userData.dir = dir;
  let r = 1.008;
  if (root) {
    const keepScale = grp.scale.clone();
    grp.scale.setScalar(1);
    grp.updateMatrixWorld(true);
    const org = grp.localToWorld(dir.clone().multiplyScalar(4));
    const ctr = grp.localToWorld(new THREE.Vector3());
    _ray.set(org, ctr.sub(org).normalize());
    const hit = _ray.intersectObject(root, true)[0];
    if (hit) r = grp.worldToLocal(hit.point.clone()).length() + 0.006;
    grp.scale.copy(keepScale);
    grp.updateMatrixWorld(true);
  }
  p.position.copy(dir).multiplyScalar(r);
  p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
}
const snapBody = b => OBJ.forEach((o,i)=>{ if(o.body===b) snapPin(i); });

const loader = new THREE.GLTFLoader();
try {
  if (THREE.DRACOLoader) {
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
    loader.setDRACOLoader(draco);
  }
  if (window.MeshoptDecoder && loader.setMeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
} catch (e) { console.warn('Decoder setup failed', e); }

// Mars texture contrast: >1 = punchier, 1 = unchanged. PIVOT = the tone that stays put (0-1).
const MARS_CONTRAST = 1.7, MARS_PIVOT = 0.42;
const MARS_MAP_FRAGMENT = `
#ifdef USE_MAP
  vec4 texelColor = texture2D( map, vUv );
  texelColor = mapTexelToLinear( texelColor );
  vec3 sc = pow( max( texelColor.rgb, vec3( 0.0 ) ), vec3( 1.0 / 2.2 ) );
  sc = clamp( ( sc - ${MARS_PIVOT.toFixed(3)} ) * ${MARS_CONTRAST.toFixed(3)} + ${MARS_PIVOT.toFixed(3)}, 0.0, 1.0 );
  texelColor.rgb = pow( sc, vec3( 2.2 ) );
  diffuseColor *= texelColor;
#endif
`;

function setupModel(filename, targetGroup, isMars = false) {
  loader.load(filename, gltf => {
    const root = gltf.scene;

    root.traverse((child) => {
      if (child.isMesh && child.material) {
        const matArray = Array.isArray(child.material) ? child.material : [child.material];
        
        matArray.forEach(mat => {
          if (mat.map) {
            mat.map.encoding = THREE.sRGBEncoding;
            mat.map.needsUpdate = true;
          }
          if (mat.emissiveMap) {
            mat.emissiveMap.encoding = THREE.sRGBEncoding;
          }

          if (isMars) {
            if ('roughness' in mat) mat.roughness = 0.95;
            if ('metalness' in mat) mat.metalness = 0.0;
            if (mat.color) mat.color.setStyle('#c85a28');
            mat.onBeforeCompile = (shader) => {
              shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', MARS_MAP_FRAGMENT);
            };
          } else {
            if ('roughness' in mat) mat.roughness = 0.96;
            if ('metalness' in mat) mat.metalness = 0.0;
            if (mat.color) mat.color.setStyle('#999999');
          }
          
          mat.needsUpdate = true;
        });
      }
    });

    const bounds = new THREE.Box3().setFromObject(root);
    const center = bounds.getCenter(new THREE.Vector3());
    const size = bounds.getSize(new THREE.Vector3());
    root.position.sub(center);
    root.scale.setScalar(2 / Math.max(size.x, size.y, size.z));

    targetGroup.add(root);
    bodyRoot[isMars ? 'mars' : 'moon'] = root;
    snapBody(isMars ? 'mars' : 'moon');
  }, undefined, error => {
    console.error(`Could not load ${filename}.`, error);
  });
}

setupModel('Assets/moon.glb', moonGroup, false);
setupModel('Assets/mars.glb', marsGroup, true);

let customRoverModel = null;
loader.load('Assets/lunar_Rover.glb', gltf => {
  customRoverModel = gltf.scene;
  customRoverModel.traverse((child) => {
    if (child.isMesh && child.material) {
      const matArr = Array.isArray(child.material) ? child.material : [child.material];
      matArr.forEach(m => {
        if (m.map) { m.map.encoding = THREE.sRGBEncoding; m.map.needsUpdate = true; }
        m.needsUpdate = true;
      });
    }
  });
  const box = new THREE.Box3().setFromObject(customRoverModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  customRoverModel.position.sub(center);
  customRoverModel.scale.setScalar(0.22 / Math.max(size.x, size.y, size.z));
}, undefined, err => {
  console.error("Could not load Assets/lunar_Rover.glb", err);
});

function glbFail(msg){
  console.error(msg);
  const t=document.createElement('div');
  t.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;padding:10px 14px;border-radius:10px;background:rgba(120,20,20,.9);color:#fff;font:13px Inter,sans-serif;max-width:90vw;text-align:center';
  t.textContent=msg+' Drag and drop the .glb onto this page to load it manually.';
  document.body.appendChild(t); setTimeout(()=>t.remove(),9000);
}
// Explains exactly why a .glb did not load: wrong name, blocked, not a GLB, or an unsupported extension
function diagnoseGlb(url, label, firstErr){
  const why = firstErr ? (firstErr.message || firstErr.type || String(firstErr)) : 'unknown error';
  fetch(url).then(r => {
    if (!r.ok) return glbFail(label + ': ' + url + ' returned HTTP ' + r.status + ' (file not in that folder or wrong name).');
    return r.arrayBuffer().then(buf => {
      const mb = (buf.byteLength / 1048576).toFixed(1) + ' MB';
      const magic = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(4, buf.byteLength)));
      if (magic !== 'glTF') return glbFail(label + ': the server sent ' + mb + ' that is not a GLB (wrong filename, or it returned a web page). URL: ' + url);
      let ext = '';
      try {
        const len = new DataView(buf).getUint32(12, true);
        const json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, len)));
        ext = ' Required extensions: ' + ((json.extensionsRequired || []).join(', ') || 'none') + '. Used: ' + ((json.extensionsUsed || []).join(', ') || 'none') + '.';
      } catch (e) {}
      glbFail(label + ' is a valid GLB (' + mb + ') but failed to parse: ' + why + '.' + ext);
    });
  }).catch(() => glbFail(label + ': could not fetch ' + url + ' (blocked by the browser - run via a local server).'));
}
// ---- Opportunity rover model (opportunity.glb) ----
let opportunityModel = null;
function prepOpportunity(gltf){
  const inner = gltf.scene;
  inner.traverse(child => {
    if (child.isMesh) {
      child.frustumCulled = false;
      (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => {
        if (!m) return;
        if (m.map) { m.map.encoding = THREE.sRGBEncoding; m.map.needsUpdate = true; }
        m.side = THREE.DoubleSide; m.needsUpdate = true;
      });
    }
  });
  inner.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(inner);
  const size = box.getSize(new THREE.Vector3());
  inner.position.sub(box.getCenter(new THREE.Vector3()));
  const pivot = new THREE.Group(); pivot.add(inner);
  pivot.scale.setScalar(1.0 / (Math.max(size.x, size.y, size.z) || 1));
  const wrap = new THREE.Group(); wrap.add(pivot);
  opportunityModel = wrap;
  console.log('Opportunity GLB ready');
  if (sel >= 0 && OBJ[sel].name === 'Opportunity') select(sel);
}
const OPPORTUNITY_FILES = ['Assets/opportunity.glb'];
(function tryLoadOpp(i, firstErr){
  if (i >= OPPORTUNITY_FILES.length) {
    diagnoseGlb(new URL(encodeURI(OPPORTUNITY_FILES[0]), location.href).href, 'Assets/opportunity.glb', firstErr);
    return;
  }
  loader.load(encodeURI(OPPORTUNITY_FILES[i]), prepOpportunity, undefined, err => tryLoadOpp(i + 1, firstErr || err));
})(0);

// manual fallback: drop the .glb onto the page
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f || !/\.glb$/i.test(f.name)) return;
  e.preventDefault();
  f.arrayBuffer().then(buf => loader.parse(buf, '', prepOpportunity, err => glbFail('That file could not be parsed.')));
});

let activeBody = 'moon';
let sel = -1;
let activeDisplayModel = null;
// Aim the globe at a site using pitch + yaw only (no roll), so the poles stay upright
// and the idle spin / drag keep working from a clean orientation after every hover.
let targetPitch = 0, targetYaw = 0;
function aimAt(site){
  const d = siteDir(site);
  targetPitch = Math.asin(THREE.MathUtils.clamp(d.y, -1, 1));
  targetYaw = -Math.atan2(d.x, d.z);
}
const currentQuaternion = new THREE.Quaternion();
let touring = false, simulating = false, simStart = 0, simKind = '';
const SIM_DUR = 7;
const ray = new THREE.Raycaster(), mp = new THREE.Vector2();

let moonScaleTarget = 1.0;
let marsScaleTarget = 0.0;

function switchBody(body) {
  if (activeBody === body) return;
  deselect();
  activeBody = body;

  document.getElementById('btn-moon').classList.toggle('active', body === 'moon');
  document.getElementById('btn-mars').classList.toggle('active', body === 'mars');

  if (body === 'moon') {
    moonGroup.visible = true;
    moonScaleTarget = 1.0;
    marsScaleTarget = 0.0;
    moonGroup.rotation.y = 0.4;
    moonGroup.rotation.x = 0.15;
  } else {
    marsGroup.visible = true;
    moonScaleTarget = 0.0;
    marsScaleTarget = 1.0;
    marsGroup.rotation.y = 0.0;
    marsGroup.rotation.x = 0.0;
  }
  updateSiteLinks();
}

const MISSIONS = {
  'Apollo 15 rover': { eyebrow:'Moon \u00b7 Rover', tag:'The first car ever driven on another world, still parked where the crew left it.', dist:'~28 km driven' },
  'Opportunity':     { eyebrow:'Mars \u00b7 Rover',   tag:'Built for 90 days, it kept roaming for fourteen years until a global dust storm.', dist:'~45 km driven' }
};
const missionBtn = document.getElementById('mission');
function updateSiteLinks() {
  const site = OBJ.map((o, idx) => ({ ...o, idx })).find(o => o.body === activeBody);
  if (!site) return;
  const m = MISSIONS[site.name] || { eyebrow:activeBody, tag:'', dist:'' };
  const q = s => missionBtn.querySelector(s);
  q('.m-eyebrow').textContent = m.eyebrow;
  q('.m-name').textContent = site.name;
  q('.m-tag').textContent = m.tag;
  const lat = Math.abs(site.lat).toFixed(2) + '\u00b0' + (site.lat >= 0 ? 'N' : 'S');
  const lon = Math.abs(site.lon).toFixed(2) + '\u00b0' + (site.lon >= 0 ? 'E' : 'W');
  const stats = q('.m-stats'); stats.textContent = '';
  [['Year', site.yr], ['Odometer', m.dist.replace(' driven','')], ['Coords', lat + ' ' + lon]].forEach(([k, v]) => {
    const e = document.createElement('em'), bb = document.createElement('b');
    bb.textContent = k; e.append(bb, v); stats.appendChild(e);
  });
  missionBtn.setAttribute('aria-label', 'Open ' + site.name);
  missionBtn.classList.remove('swap'); void missionBtn.offsetWidth; missionBtn.classList.add('swap');
  missionBtn.onmouseenter = () => { if (sel >= 0) return; aimAt(site); touring = true; };
  missionBtn.onmouseleave = () => { if (sel >= 0) return; touring = false; isHoveringGlobe = false; };
  missionBtn.onclick = () => { touring = false; select(site.idx); };
}

function setText(t){
  tx.textContent=t;
}
function ui(){
  simBtn.textContent=simulating?'Stop':'Simulate';
  simBtn.classList.toggle('on',simulating);
  simBtn.disabled=sel<0;
  nextBtn.disabled=sel<0;
  xb.hidden=sel<0;
}
function stopSpeech(){stopSim();}
function startSim(){
  if(sel<0||!activeDisplayModel)return;
  simulating=true;
  simStart=clock.elapsedTime;
  simKind=OBJ[sel].m;
  ui();
}
function stopSim(){
  if(!simulating)return;
  simulating=false;
  if(activeDisplayModel&&sel>=0)activeDisplayModel.position.set(...eq(OBJ[sel]).pos);
  ui();
}

// ---- Per-equipment placement: edit pos [x,y,z], scale (multiplier) and tilt (radians) for each site ----
// Press "E" in the viewer to edit the selected equipment live; the values print on screen and in the console.
const EQUIP_DEFAULT = { pos: [0, -0.06, 1.35], scale: 1, tilt: 0.2 };
const EQUIP = {
  'Apollo 15 rover':         { pos: [0, -0.06, 1.35], scale: 4.5, tilt: 0.2 },
  'Opportunity':             { pos: [0, -0.06, 1.35], scale: 1,   tilt: 0.2 },
};
try { const saved = JSON.parse(localStorage.getItem('EQUIP_SAVED') || 'null'); if (saved) Object.keys(saved).forEach(k => { EQUIP[k] = Object.assign(EQUIP[k] || {}, saved[k]); }); } catch (e) {}
const saveEquip = () => { try { localStorage.setItem('EQUIP_SAVED', JSON.stringify(EQUIP)); } catch (e) {} };
const eq = o => { const e = EQUIP[o.name] || (EQUIP[o.name] = {}); return Object.assign(e, { pos: e.pos || EQUIP_DEFAULT.pos.slice(), scale: e.scale ?? EQUIP_DEFAULT.scale, tilt: e.tilt ?? EQUIP_DEFAULT.tilt }); };

function select(i){
  const o=OBJ[i];
  stopSpeech();
  if(o.body!=activeBody) switchBody(o.body);
  sel=i;
  
  aimAt(o);
  touring = false;
  
  if(activeDisplayModel) scene.remove(activeDisplayModel);

  if (o.m === 'lrv' && customRoverModel) {
    activeDisplayModel = customRoverModel.clone(true);
  } else if (o.name === 'Opportunity' && opportunityModel) {
    activeDisplayModel = opportunityModel; // reused directly (clone breaks skinned meshes)
    activeDisplayModel.userData.spin = null;
  } else {
    activeDisplayModel = build(o.m);
  }

  activeDisplayModel.position.set(...eq(o).pos);
  activeDisplayModel.rotation.x = eq(o).tilt;
  activeDisplayModel.scale.setScalar(.001);
  scene.add(activeDisplayModel);

  nm.textContent=o.name;
  yr.textContent=(o.body=='moon'?'Moon, ':'Mars, ')+o.yr;
  setText(o.t);
  ui();
  tooltip.style.opacity = 0;
}

function deselect(){
  stopSpeech();
  touring=false;
  sel=-1;
  if(activeDisplayModel){scene.remove(activeDisplayModel);activeDisplayModel=null;}
  nm.textContent='Pick a site';
  yr.textContent='NASA hardware left behind';
  tx.textContent=INTRO;
  ui();
}

xb.onclick=()=>deselect();

  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));

let dragging=false, previousX=0, previousY=0;
let isInteracting = false;
let isHoveringGlobe = false;

const sphereRay = new THREE.Raycaster();
const spherePointer = new THREE.Vector2();

canvas.addEventListener('pointerdown', event => {
  isInteracting = true;
  previousX = event.clientX;
  previousY = event.clientY;
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {
  const r = canvas.getBoundingClientRect();
  mp.set((event.clientX - r.left) / r.width * 2 - 1, -(event.clientY - r.top) / r.height * 2 + 1);

  spherePointer.copy(mp);
  sphereRay.setFromCamera(spherePointer, camera);
  const activeGroup = activeBody === 'moon' ? moonGroup : marsGroup;
  
  const dist = sphereRay.ray.distanceToPoint(activeGroup.position);
  isHoveringGlobe = (dist <= 1.05);

  if (sel < 0) {
    ray.setFromCamera(mp, camera);
    const hitboxes = pins.filter(p => p.visible).map(p => p.userData.h);
    const h = ray.intersectObjects(hitboxes)[0];

    if (h && h.object.userData.i !== undefined) {
      const site = OBJ[h.object.userData.i];
      tooltip.textContent = site.name;
      tooltip.style.left = event.clientX + 'px';
      tooltip.style.top = event.clientY + 'px';
      tooltip.style.opacity = 1;
      canvas.style.cursor = 'pointer';
    } else {
      tooltip.style.opacity = 0;
      canvas.style.cursor = isInteracting ? 'grabbing' : 'default';
    }
  }

  if (!isInteracting) return;
  touring = false;
  const dx = event.clientX - previousX;
  const dy = event.clientY - previousY;
  previousX = event.clientX;
  previousY = event.clientY;

  if (sel < 0) {
    const targetGroup = activeBody === 'moon' ? moonGroup : marsGroup;
    targetGroup.rotation.y += dx * 0.006;
    targetGroup.rotation.x = THREE.MathUtils.clamp(targetGroup.rotation.x + dy * 0.006, -1.2, 1.2);
  }
});

function stopInteraction() { isInteracting = false; }
canvas.addEventListener('pointerup', stopInteraction);
canvas.addEventListener('pointercancel', stopInteraction);
canvas.addEventListener('pointerleave', () => { isHoveringGlobe = false; });

canvas.addEventListener('pointerup', event => {
  if (sel >= 0) return;

  const r = canvas.getBoundingClientRect();
  mp.set((event.clientX - r.left) / r.width * 2 - 1, -(event.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mp, camera);
  const hitboxes = pins.filter(p => p.visible).map(p => p.userData.h);
  const h = ray.intersectObjects(hitboxes)[0];
  if (h && h.object.userData.i !== undefined) {
    touring = false;
    select(h.object.userData.i);
  }
});

canvas.addEventListener('wheel', event => {
  event.preventDefault();
  targetZoom = THREE.MathUtils.clamp(
    targetZoom * Math.exp(event.deltaY * 0.001),
    MIN_ZOOM,
    MAX_ZOOM
  );
}, { passive: false });

const worldPos = new THREE.Vector3();
const camPos = new THREE.Vector3();

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  const asp = camera.aspect;

  const activeGroup = activeBody === 'moon' ? moonGroup : marsGroup;

  if (sel >= 0 || touring) {
    const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
    activeGroup.rotation.x += (targetPitch - activeGroup.rotation.x) * 0.08;
    activeGroup.rotation.y += wrap(targetYaw - activeGroup.rotation.y) * 0.08;
    activeGroup.rotation.z = 0;
  } else {
    if (!isInteracting && !isHoveringGlobe && !reduce) {
      moonGroup.rotation.y += dt * 0.12;
      marsGroup.rotation.y += dt * 0.12;
    }
  }

  const DESIRED_SELECT_ZOOM = 1.85;
  const desiredZ = sel >= 0 ? DESIRED_SELECT_ZOOM : targetZoom;
  camera.position.z += (desiredZ - camera.position.z) * 0.06;
  camera.position.y += (0 - camera.position.y) * 0.06;

  if (activeDisplayModel) {
    const E = eq(OBJ[sel]);
    const tgt = .08 * Math.min(1, asp/.75) * E.scale;
    const s = activeDisplayModel.scale.x + (tgt - activeDisplayModel.scale.x) * .08;
    activeDisplayModel.scale.setScalar(s);
    
    let rotorSpeed = 8;
    if (simulating) {
      const p = Math.min((t - simStart) / SIM_DUR, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      const m = activeDisplayModel;
      if (simKind === 'lander' || simKind === 'tripod') {
        const settle = p > 0.85 ? Math.sin((p - 0.85) / 0.15 * Math.PI) * 0.004 : 0;
        m.position.set(E.pos[0], E.pos[1] + (1 - ease) * 0.3 + settle, E.pos[2]);
        m.rotation.y += 0.004;
      } else if (simKind === 'heli') {
        const lift = Math.sin(Math.min(p / 0.9, 1) * Math.PI);
        m.position.set(E.pos[0], E.pos[1] + lift * 0.16, E.pos[2]);
        m.rotation.y += 0.004;
        rotorSpeed = 40 * Math.min(1, lift * 4 + 0.2);
      } else {
        const a = p * Math.PI * 2;
        const R = 0.11;
        m.position.set(E.pos[0] + R * Math.sin(a), E.pos[1], E.pos[2] - R * (1 - Math.cos(a)) * 0.6);
        m.rotation.y = a;
      }
      if (p >= 1) stopSim();
    } else {
      activeDisplayModel.rotation.y += 0.004;
      activeDisplayModel.position.set(...E.pos);
    }
    activeDisplayModel.rotation.x = E.tilt;
    activeDisplayModel.rotation.z = 0;

    if (activeDisplayModel.userData.spin) {
      activeDisplayModel.userData.spin.forEach((r,j)=>r.rotation.y+=(j?-1:1)*dt*rotorSpeed);
    }
  }

  const scaleSpeed = 6.0;
  const currentMoonScale = THREE.MathUtils.lerp(moonGroup.scale.x, moonScaleTarget, dt * scaleSpeed);
  const currentMarsScale = THREE.MathUtils.lerp(marsGroup.scale.x, marsScaleTarget, dt * scaleSpeed);

  moonGroup.scale.setScalar(currentMoonScale);
  marsGroup.scale.setScalar(currentMarsScale);

  if (currentMoonScale < 0.005) moonGroup.visible = false;
  if (currentMarsScale < 0.005) marsGroup.visible = false;
  if (moonScaleTarget > 0.5) moonGroup.visible = true;
  if (marsScaleTarget > 0.5) marsGroup.visible = true;

  camera.getWorldPosition(camPos);

  pins.forEach((p, i) => {
    const o = OBJ[i];
    const belongsToActive = (activeBody === 'moon' && o.body === 'moon') || (activeBody === 'mars' && o.body === 'mars');
    if (!belongsToActive) {
      p.visible = false;
      return;
    }

    if (sel >= 0) {
      p.visible = false;
      return;
    }

    p.getWorldPosition(worldPos);
    const normalWorld = worldPos.clone().sub(activeGroup.position).normalize();
    const toCam = camPos.clone().sub(worldPos).normalize();
    const facing = normalWorld.dot(toCam);

    if (facing < 0.05) {
      p.visible = false;
      return;
    }

    p.visible = true;
    const isSelected = i === sel;
    const scaleTargetVal = isSelected ? 1.4 : 1.0;
    p.scale.lerp(new THREE.Vector3(scaleTargetVal, scaleTargetVal, scaleTargetVal), 0.1);

    const rings = p.userData.rings;
    const phase = p.userData.phase;
    const duration = 2.2;
    
    rings.forEach((ring, rIdx) => {
      const progress = ((t + phase + rIdx * (duration / rings.length)) % duration) / duration;
      const ringScale = 1.0 + progress * 4.5;
      ring.scale.setScalar(ringScale);
      
      const alpha = Math.max(0, (1 - progress) * (isSelected ? 1.0 : 0.9)) * Math.min(1, facing * 3);
      ring.material.opacity = alpha;
    });
  });

  renderer.render(scene, camera);
})();

// ---- Coordinate tracker (press Y) ----------------------------------------
// Shows the lat/lon under the cursor. Uses the exact inverse of dirV(), so the numbers
// line up with the pin positions and respect the ALIGN calibration (press C).
(function(){
  const el=document.getElementById('coord'),dot=document.getElementById('coord-dot'),toast=document.getElementById('coord-toast');
  let on=false,inside=false,cx=0,cy=0,toastTimer=0;
  const rc=new THREE.Raycaster(),ndc=new THREE.Vector2(),inv=new THREE.Matrix4(),
        unit=new THREE.Sphere(new THREE.Vector3(),1),hit=new THREE.Vector3();
  const R2D=180/Math.PI,wrap180=d=>((d%360)+540)%360-180;
  const fmt=(v,pos,neg)=>Math.abs(v).toFixed(3)+'\u00b0 '+(v>=0?pos:neg);

  function pick(){
    const g=activeBody==='moon'?moonGroup:marsGroup;
    if(!g.visible)return null;
    const r=canvas.getBoundingClientRect();
    ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);
    rc.setFromCamera(ndc,camera);
    g.updateMatrixWorld(true);
    inv.copy(g.matrixWorld).invert();
    const ray=rc.ray.clone().applyMatrix4(inv);          // ray in the globe's local space
    if(!ray.intersectSphere(unit,hit))return null;
    hit.normalize();
    const A=ALIGN[activeBody]||{lon:0,lat:0,flip:false};
    const lat=Math.asin(THREE.MathUtils.clamp(hit.y,-1,1))*R2D-A.lat;
    let lon=wrap180(Math.atan2(hit.x,hit.z)*R2D-A.lon);
    if(A.flip)lon=-lon;
    return{lat,lon};
  }

  function hide(){el.style.opacity=0;dot.style.opacity=0;}

  function update(){
    if(!on||!inside){hide();return;}
    const p=pick();
    if(!p){hide();return;}
    el.innerHTML='<div><b>LAT</b><span>'+fmt(p.lat,'N','S')+'</span></div><div><b>LON</b><span>'+fmt(p.lon,'E','W')+'</span></div>';
    const w=el.offsetWidth,h=el.offsetHeight,pad=16;
    let x=cx+pad,y=cy+pad;
    if(x+w>innerWidth-8)x=cx-pad-w;
    if(y+h>innerHeight-8)y=cy-pad-h;
    el.style.transform='translate('+x+'px,'+y+'px)';
    dot.style.transform='translate('+cx+'px,'+cy+'px)';
    el.style.opacity=1;dot.style.opacity=1;
  }

  // Re-run every frame while on, so it stays correct while the globe spins or zooms under a still cursor.
  function loop(){if(!on)return;update();requestAnimationFrame(loop);}

  function say(msg){
    toast.textContent=msg;toast.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1400);
  }

  canvas.addEventListener('pointermove',e=>{cx=e.clientX;cy=e.clientY;inside=true;});
  canvas.addEventListener('pointerleave',()=>{inside=false;});
  canvas.addEventListener('pointerdown',e=>{cx=e.clientX;cy=e.clientY;inside=true;});

  addEventListener('keydown',e=>{
    if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
    if(e.key.toLowerCase()!=='y')return;
    on=!on;
    if(on){loop();}else{hide();}
    say(on?'Coordinate tracker on':'Coordinate tracker off');
  });
})();
